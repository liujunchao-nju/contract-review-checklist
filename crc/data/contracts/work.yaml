type: work
label: 承揽合同
category: 服务类
summary: 承揽人按定作人的要求完成工作并交付成果，定作人给付报酬。

legal_basis:
  - 民法典第770条
  - 民法典第772条
  - 民法典第787条

checks:
  macro:
    - id: work-subject
      question: 工作成果是否特定且可验收？是承揽、买卖还是建设工程？
      risk: major
      guidance: 承揽重在工作过程与成果，买卖重在标的物转移；建设工程适用更严格的资质与质量规则，定性错了整套条款都要重来。
      basis:
        - 民法典第770条

    - id: work-qualification
      question: 承揽事项是否需要资质？涉及特种作业的，承揽人是否具备？
      risk: fatal
      guidance: 需资质而未取得的，不仅履行受阻，还可能触发行政责任，属先于条款审查的事项。
      basis:
        - 民法典第770条

  meso:
    - id: work-subcontract
      question: 主要工作由谁完成？是否允许交由第三人完成？
      risk: major
      guidance: 承揽人应当以自己的设备、技术和劳力完成主要工作；未经定作人同意交第三人完成的，定作人可以解除合同。
      party_notes:
        甲方: 作为定作人，应保留「未经书面同意不得转包」的解除权，并约定第三人的成果仍由承揽人负责。
        乙方: 作为承揽人，应争取写明可分包的部分与「就第三人成果向定作人负责」的责任边界，避免被认定为根本违约。
      basis:
        - 民法典第772条

    - id: work-termination
      question: 定作人在完成工作前可随时解除，这一点是否已纳入成本安排？
      risk: major
      guidance: 定作人的任意解除权是法定权利，承揽人无法排除，只能通过进度结算与已发生成本的补偿来保护投入。
      party_notes:
        甲方: 随时解除是我方的法定优势，但须赔偿承揽人损失，宜约定按已完工作量结算。
        乙方: 我方可能在完工前被解除，应约定解除时的结算口径与已采购材料的处理，避免投入沉没。
      risk_by_party:
        乙方: major
      basis:
        - 民法典第787条

    - id: work-acceptance
      question: 验收标准、期限与不合格的处理是否可操作？
      risk: major
      guidance: 验收标准写成「满足定作人要求」等于没有标准，应落到图纸、样品、国家或行业标准与具体指标。
      basis:
        - 民法典第770条

  micro:
    - id: work-material
      question: 材料由谁提供？规格、损耗与风险由谁承担？
      risk: minor
      guidance: 材料提供方的不同会改变风险分配与质量责任的归属，应在条款中明确到具体批次与规格。
      basis:
        - 民法典第770条

    - id: work-risk
      question: 工作成果毁损灭失的风险何时转移？交付前的风险由谁承担？
      risk: major
      guidance: 承揽期间的风险承担与交付节点直接相关，未约定的会在成果毁损时产生争议。
      basis:
        - 民法典第770条

    - id: work-ip
      question: 工作成果的知识产权归属是否约定？背景成果是否排除在外？
      risk: major
      guidance: 未约定归属的，著作权默认归承揽人；定作人只取得使用权的，后续改造与再许可会受限。
      basis:
        - 民法典第770条

clauses:
  - name: 工作内容与技术标准条款
    required: true
    keywords: [工作内容, 技术标准, 图纸]
    aliases: [承揽内容, 技术要求, 样品]
    elements:
      - 工作成果的名称、规格与数量
      - 依据的图纸、样品或标准编号
      - 标准的优先适用顺序
    issues:
      - 标准写成「满足定作人要求」
      - 图纸与文字描述不一致未定优先级
    redline: |
      承揽人应按附件《技术规格书》及编号为【】的图纸完成【成果名称】，数量为【】。质量要求以《技术规格书》为准；该文件未涉及的，依次适用国家标准、行业标准；上述标准均不存在的，按符合合同目的的通常标准执行。附件与正文不一致的，以《技术规格书》为准。
    basis:
      - 民法典第770条

  - name: 材料提供与风险负担条款
    required: true
    keywords: [材料, 由定作人提供, 由承揽人提供]
    aliases: [原材料, 辅料]
    elements:
      - 材料提供方与规格
      - 材料检验与异议期限
      - 交付前成果毁损灭失的风险承担
    issues:
      - 未写明材料由谁提供
      - 未约定交付前的风险承担
    redline: |
      本工程所需材料由【承揽人/定作人】提供，规格见附件清单。定作人提供材料的，承揽人应在收到后【三】日内检验并书面提出异议，逾期未提出视为合格。工作成果交付前毁损、灭失的风险由承揽人承担；因定作人提供的材料本身存在缺陷造成的除外。
    basis:
      - 民法典第770条

  - name: 履行期限与交付条款
    required: true
    keywords: [交付, 工期, 完成期限]
    aliases: [完工, 交付期限]
    elements:
      - 开工与完工的时间节点
      - 交付地点与方式
      - 逾期的违约责任
    issues:
      - 只写总工期，无阶段节点
      - 未约定逾期违约金的计算方式
    redline: |
      承揽人应于【日期】前完成全部工作并交付成果，交付地点为【】。承揽人逾期交付的，每逾期一日按合同总价款的【万分之五】向定作人支付违约金，违约金总额不超过合同总价款的【百分之十】；逾期超过【十五】日的，定作人有权解除合同并要求赔偿损失。
    basis:
      - 民法典第770条

  - name: 验收与质量保证条款
    required: true
    keywords: [验收, 验收标准, 质保期]
    aliases: [检验, 质量保证期]
    elements:
      - 验收的程序与期限
      - 不合格时的修理、重作与减酬
      - 质保期的长度与起算点
    issues:
      - 验收期限过短或未约定
      - 未约定质保期
    redline: |
      定作人应在收到成果后【七】日内按《技术规格书》验收并书面提出异议；逾期未提出的视为验收合格。验收不合格的，承揽人应在【十】日内免费修理或重作，因此导致逾期的按逾期条款处理。成果自验收合格之日起质保【十二】个月，质保期内因材料或工艺原因出现的质量问题由承揽人免费修复。
    basis:
      - 民法典第770条

  - name: 任意解除与结算条款
    required: false
    keywords: [解除, 定作人解除, 停工]
    aliases: [中途解除]
    elements:
      - 解除的通知方式与生效
      - 已完工作量的结算口径
      - 已采购材料与在制品的处理
    issues:
      - 约定「不得解除」，与法定权利冲突
      - 未约定解除时的结算口径
    redline: |
      定作人在承揽人完成工作前可以随时解除合同，但应提前【十】日书面通知并就承揽人已完成的工作及已合理支出的费用予以补偿。补偿数额按已完成工作量占全部工作的比例乘以合同总价款计算，另加承揽人为履行本合同已采购且无法另行使用的材料成本。
    basis:
      - 民法典第787条

red_flags:
  - id: work-subcontract-all
    name: 全部工作转交第三人
    patterns: [全部转包, 交由第三方完成, 全部交由第三人]
    risk: fatal
    message: 承揽人将主要工作交第三人完成未经定作人同意的，定作人可以解除合同，成果质量与责任也会失控。
    basis:
      - 民法典第772条

  - id: work-acceptance-deemed
    name: 逾期视为验收合格且期限过短
    patterns: [逾期视为验收合格, 三日内未提出异议视为合格, 视为验收通过]
    risk: major
    message: 验收期限过短或逾期即视为合格，会剥夺定作人实质检验的机会，应与检验实际所需时间匹配。
    basis:
      - 民法典第770条
