type: guarantee
label: 保证合同
category: 金融类
summary: 保证人与债权人约定，债务人不履行到期债务时由保证人履行或承担责任。

legal_basis:
  - 民法典第681条
  - 民法典第686条
  - 民法典第692条

checks:
  macro:
    - id: guarantee-capacity
      question: 保证人是否具备代为清偿的能力？是否属于不得为保证人的主体？
      risk: fatal
      guidance: 保证的价值取决于保证人的清偿能力，主体不适格或明确保证能力的，担保形同虚设。
      basis:
        - 民法典第681条

    - id: guarantee-nature
      question: 名为保证实为债务加入、抵押或独立承诺？定性不同，抗辩权完全不同。
      risk: fatal
      guidance: 裁判按合同内容而非名称认定关系；差额补足、流动性支持一类表述可能被认定为保证或债务加入。
      basis:
        - 合同编通则解释第15条

    - id: guarantee-debt
      question: 所担保的主债务是否特定？主债务不存在的，保证无从成立。
      risk: major
      guidance: 主债务的种类、数额与履行期限必须可确定，概括担保未来债务的应写明范围与最高额。
      basis:
        - 民法典第681条

  meso:
    - id: guarantee-mode
      question: 保证方式是否写明？未约定或约定不明按一般保证处理。
      risk: fatal
      guidance: 民法典改变了旧法的推定规则，未约定保证方式的按一般保证承担保证责任，债权人不能再当然主张连带。
      party_notes:
        甲方: 作为债权人，必须写明「连带责任保证」，否则只能按一般保证主张，先诉抗辩权会拖长实现周期。
        乙方: 作为保证人，约定不明对我方有利；若对方要求连带，应以缩短保证期间或限定范围为交换。
      risk_by_party:
        甲方: fatal
        乙方: major
      basis:
        - 民法典第686条

    - id: guarantee-period
      question: 保证期间是否明确约定？约定不当的会被视为没有约定。
      risk: fatal
      guidance: 约定的保证期间早于主债务履行期限或与其同时届满的，视为没有约定，依法为主债务履行期限届满之日起六个月。
      basis:
        - 民法典第692条

    - id: guarantee-scope
      question: 保证范围是否写明（主债权、利息、违约金、损害赔偿金、实现债权的费用）？
      risk: major
      guidance: 范围未约定的依法定范围，但实现债权的费用是否包含在内常被争执，宜明确列举。
      basis:
        - 民法典第681条

  micro:
    - id: guarantee-claim
      question: 债权人主张权利的方式与期限是否可操作？一般保证是否须先经诉讼或仲裁？
      risk: major
      guidance: 一般保证下，债权人须先就债务人财产依法强制执行仍不能履行后才能要求保证人承担；连带保证无此限制。
      basis:
        - 民法典第686条

    - id: guarantee-recourse
      question: 保证人承担责任后的追偿权与代位权是否约定？是否有反担保？
      risk: minor
      guidance: 追偿是法定权利，但约定追偿的范围、期限与实现方式能显著降低二次争议的成本。
      basis:
        - 民法典第681条

    - id: guarantee-change
      question: 主债务变更、转让或展期时，保证责任的延续是否写明？
      risk: major
      guidance: 主债务展期未经保证人书面同意的，保证期间不受影响；加重债务的，保证人对加重部分不承担责任。
      basis:
        - 民法典第692条

clauses:
  - name: 被担保主债权条款
    required: true
    keywords: [主债权, 主债务, 被担保]
    aliases: [主合同, 主债务履行期限]
    elements:
      - 主合同的名称与编号
      - 主债务的种类与数额
      - 主债务的履行期限
    issues:
      - 主债务未特定化
      - 概括担保未来债务却未设最高额
    redline: |
      本合同所担保的主债权为债权人与债务人【名称】之间于【日期】签订的《【主合同名称】》（编号：【】）项下，债务人所负的【借款本金/货款】债务，本金数额为人民币【】元，履行期限自【】至【】。担保范围包括主债权本金、利息、违约金、损害赔偿金以及债权人实现债权的合理费用。
    basis:
      - 民法典第681条

  - name: 保证方式条款
    required: true
    keywords: [连带责任保证, 一般保证, 保证方式]
    aliases: [连带保证, 保证责任的方式]
    elements:
      - 明确选择一般保证或连带责任保证
      - 连带保证下债权人可直接要求保证人承担
      - 一般保证下先诉抗辩权的处理
    issues:
      - 只写「保证人承担保证责任」，方式不明
      - 沿用旧法表述，默认连带
    redline: |
      保证人自愿为上述主债权提供【连带责任保证】。主债务履行期限届满而债务人未履行的，债权人有权直接要求保证人在保证范围内承担保证责任，无须先行向债务人追索。【若选一般保证：保证人承担一般保证责任，债权人经依法强制执行债务人财产仍不能清偿的，方可要求保证人承担保证责任。】
    basis:
      - 民法典第686条

  - name: 保证期间条款
    required: true
    keywords: [保证期间, 保证责任期间]
    aliases: [保证期限, 承担保证责任的期间]
    elements:
      - 保证期间的起算点
      - 期间长度，须晚于主债务履行期限届满之日
      - 期间内主张权利的方式与留痕
    issues:
      - 约定期间早于或等于主债务履行期限
      - 写成「直至本息还清为止」这类约定不明的表述
    redline: |
      保证期间为主债务履行期限届满之日起【三】年。债权人应在保证期间内以书面方式向保证人主张保证责任，并保留送达凭证；逾期未主张的，保证人不再承担保证责任。保证期间不因任何事由发生中止、中断或延长。
    basis:
      - 民法典第692条

  - name: 保证责任范围与上限条款
    required: true
    keywords: [保证范围, 担保范围, 保证限额]
    aliases: [最高额保证, 保证责任限额]
    elements:
      - 本金、利息、违约金、损害赔偿金
      - 实现债权的费用是否包含
      - 是否设最高额上限
    issues:
      - 未写明上限，敞口无限
      - 未约定实现债权费用的承担
    redline: |
      保证人承担保证责任的范围以主债权本金人民币【】元及其利息、违约金、损害赔偿金为限，保证责任的最高数额不超过人民币【】元。债权人实现债权所支出的律师费、保全费、公证费等合理费用，凭有效凭证列入保证范围，但以最高数额为限。
    basis:
      - 民法典第681条

  - name: 主债务变更与保证责任延续条款
    required: false
    keywords: [主债务变更, 债务展期, 债权转让]
    aliases: [主合同变更, 展期协议]
    elements:
      - 展期、加重要件须经保证人书面同意
      - 债权转让后保证责任的延续
      - 未经同意时保证期间是否受影响
    issues:
      - 未约定展期的处理，保证人主张免责
      - 债权转让未通知保证人
    redline: |
      债权人与债务人协议变更主合同内容，或就主债务达成展期安排的，应当取得保证人书面同意；未经保证人书面同意加重债务的，保证人对加重的部分不承担保证责任，保证期间仍按原约定计算。债权人转让主债权的，保证人在原保证范围内继续承担保证责任，转让应书面通知保证人。
    basis:
      - 民法典第692条

red_flags:
  - id: guarantee-mode-silent
    name: 保证方式未明确
    patterns: [承担保证责任, 作为保证人, 提供担保]
    risk: fatal
    message: 未约定或约定不明保证方式的，依法按一般保证承担保证责任，债权人不能再当然主张连带。
    basis:
      - 民法典第686条

  - id: guarantee-period-vague
    name: 保证期间约定不明
    patterns: [直至本息还清, 直至全部清偿, 直至债务履行完毕]
    risk: fatal
    message: 此类表述属于约定不明，保证期间依法为主债务履行期限届满之日起六个月，短于多数交易的预期。
    basis:
      - 民法典第692条
