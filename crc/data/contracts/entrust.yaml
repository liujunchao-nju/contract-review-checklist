type: entrust
label: 委托合同
category: 服务类
summary: 受托人处理委托人事务，常见于代理、代办、运营托管与专项顾问场景。

legal_basis:
  - 民法典第919条
  - 民法典第933条

checks:
  macro:
    - id: entrust-scope
      question: 委托事务的边界是否写清？是否涉及须持牌或须批准的事项？
      risk: fatal
      guidance: 委托事项本身违法或须资质而未取得的，合同效力与履行都会出问题，先看事项再看条款。
      basis:
        - 民法典第919条

    - id: entrust-nature
      question: 名为委托实为买卖、居间或承揽？定性不同，风险分配完全不同。
      risk: major
      guidance: 裁判按合同内容而非名称认定关系，名为委托实为买卖的会适用买卖规则，验收与风险转移的口径随之改变。
      basis:
        - 合同编通则解释第15条

  meso:
    - id: entrust-authority
      question: 受托人的代理权限与转委托权限是否写明？
      risk: major
      guidance: 权限不明会让受托人的行为效力悬空，越权行为的后果归属由委托人承担，风险集中在委托人一侧。
      party_notes:
        甲方: 作为委托人，权限应逐项列举并写明「未经书面同意不得转委托」，越权后果由受托人承担。
        乙方: 作为受托人，权限列举过窄会束缚履约，宜保留为完成事务所必需的附随权限与紧急处置权。
      basis:
        - 民法典第919条

    - id: entrust-termination
      question: 是否意识到双方均可随时解除？解除后的赔偿范围是否预先安排？
      risk: major
      guidance: 委托合同的双方享有任意解除权，这是法定权利，无法用「不得解除」的约定排除，只能事先安排赔偿口径。
      party_notes:
        甲方: 随时解除对我方灵活，但若受托人已投入，需赔偿可得利益，宜约定阶段性结算与交接。
        乙方: 我方随时可能被解除，应约定最低服务期、已完工作的结算与解约补偿，避免投入无法回收。
      basis:
        - 民法典第933条

    - id: entrust-fee
      question: 报酬的计取方式、支付节点与费用垫付是否明确？
      risk: major
      guidance: 有偿与否直接影响任意解除的赔偿范围，无偿委托只赔直接损失，有偿委托还要赔可得利益。
      basis:
        - 民法典第933条

  micro:
    - id: entrust-report
      question: 受托人的报告义务与成果交付形式是否写明？
      risk: minor
      guidance: 事务处理的进度与结果若不要求定期报告，委托人无从监督，争议时也无据可查。
      basis:
        - 民法典第919条

    - id: entrust-liability
      question: 受托人的过错标准与责任上限是否约定？
      risk: major
      guidance: 有偿委托下受托人应尽善良管理人的注意义务，责任上限宜与报酬规模匹配，避免无限敞口。
      basis:
        - 民法典第933条

clauses:
  - name: 委托事项与权限条款
    required: true
    keywords: [委托事项, 委托权限, 代理权限]
    aliases: [委托事务, 授权范围]
    elements:
      - 委托事务的具体内容清单
      - 授权范围与金额上限
      - 是否允许转委托
      - 越权行为的处理
    issues:
      - 委托事项写成一句话，边界不清
      - 未限制转委托
    redline: |
      委托人委托受托人办理下列事项：（一）【事项一】；（二）【事项二】。受托人的代理权限以本条列举为限，单笔处置金额超过人民币【】元的，须事先取得委托人书面同意。未经委托人书面同意，受托人不得转委托；受托人越权行为的法律后果由其自行承担，因此给委托人造成损失的应予赔偿。
    basis:
      - 民法典第919条

  - name: 报酬与费用条款
    required: true
    keywords: [报酬, 服务费, 费用]
    aliases: [委托报酬, 代理费]
    elements:
      - 报酬数额或计取方式
      - 支付节点与条件
      - 垫付费用的报销与凭证
      - 是否有预付与结算
    issues:
      - 未写明是否有偿，影响解除赔偿范围
      - 垫付费用未约定报销期限
    redline: |
      本合同为有偿委托，委托人应向受托人支付报酬人民币【】元，于【条件成就/事项完成】后【十】个工作日内支付。受托人为处理委托事务垫付的必要费用，凭有效凭证由委托人实报实销，委托人应于收到凭证后【十】个工作日内支付。受托人应就费用支出保留完整凭证备查。
    basis:
      - 民法典第933条

  - name: 报告与成果交付条款
    required: true
    keywords: [报告, 交付, 汇报]
    aliases: [工作报告, 成果]
    elements:
      - 定期报告的周期与形式
      - 事务完成时提交的文件清单
      - 委托人提出异议的期限
    issues:
      - 未约定报告义务，委托人无从监督
      - 未约定异议期限，事后难以追责
    redline: |
      受托人应每【月】以书面方式向委托人报告事务处理进展；事务完成时，应提交完整的工作成果与下列文件：【文件清单】。委托人应在收到后【七】个工作日内提出书面异议，逾期未提出的视为认可，但存在故意或重大过失的除外。
    basis:
      - 民法典第919条

  - name: 任意解除与结算条款
    required: true
    keywords: [解除, 任意解除, 终止]
    aliases: [提前终止, 解除本合同]
    elements:
      - 解除的通知方式与生效时点
      - 已完工作的结算口径
      - 解除后的交接与资料返还
    issues:
      - 约定「不得解除」，与法定任意解除权冲突
      - 未约定解除后的结算口径
    redline: |
      双方均可随时解除本合同，但应提前【十五】日以书面方式通知对方。合同解除后，委托人应按受托人已完成工作的比例结算报酬；因解除给对方造成损失的，除不可归责于该当事人的事由外，解除方应予赔偿。受托人应在解除后【五】个工作日内完成工作交接并返还全部资料。
    basis:
      - 民法典第933条

  - name: 责任范围与上限条款
    required: false
    keywords: [赔偿责任, 责任限额, 违约责任]
    aliases: [责任上限]
    elements:
      - 过错标准
      - 赔偿范围是否含可得利益
      - 责任上限与除外情形
    issues:
      - 未设上限，敞口无限
      - 约定排除故意与重大过失责任
    redline: |
      受托人因过错未完成委托事务或给委托人造成损失的，应承担赔偿责任。受托人依据本合同承担的赔偿责任总额，以委托人实际支付的报酬为限；但因受托人故意或者重大过失造成的损失，以及造成人身损害的情形，不适用该限额。
    basis:
      - 民法典第933条

red_flags:
  - id: entrust-no-termination
    name: 排除任意解除权的约定
    patterns: [不得解除本合同, 任何一方不得单方解除, 不得提前终止]
    risk: minor
    message: 委托合同的任意解除权是法定权利，此类约定通常不能排除对方行使，只能另行安排赔偿与结算。
    basis:
      - 民法典第933条

  - id: entrust-blanket-authority
    name: 概括授权无边界
    patterns: [全权代理, 全权处理, 一切相关事务]
    risk: major
    message: 概括授权使委托人无法控制风险敞口，越权行为的后果仍可能由委托人对外承担。
    basis:
      - 民法典第919条
