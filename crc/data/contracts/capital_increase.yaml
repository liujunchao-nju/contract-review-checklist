type: capital_increase
label: 增资扩股协议
category: 公司类
summary: 投资人认购公司新增注册资本，取得或增持股权，原股东的权利义务相应调整。

legal_basis:
  - 公司法第47条
  - 公司法第227条

checks:
  macro:
    - id: capital-resolution
      question: 增资是否经股东会决议？决议程序与表决比例是否符合章程与法律？
      risk: fatal
      guidance: 增资属股东会职权，程序缺失会直接影响增资的效力，属先于文本审查的事项。
      basis:
        - 公司法第227条

    - id: capital-preemptive
      question: 原股东的优先认缴权是否已依法处理？是否放弃、如何放弃？
      risk: fatal
      guidance: 有限责任公司增资时，股东在同等条件下有权优先按实缴出资比例认缴；未处理的，增资决议与协议都可能被主张瑕疵。
      party_notes:
        甲方: 作为投资人，应要求取得全体原股东放弃优先认缴权的书面文件，否则交割后仍可能被主张。
        乙方: 作为原股东，若我方有意跟投，切勿轻易出具放弃声明；放弃应换取对价或保留按比例跟投的权利。
      risk_by_party:
        甲方: fatal
      basis:
        - 公司法第227条

    - id: capital-contribution
      question: 新增资本的出资期限是否符合五年内缴足的要求？
      risk: major
      guidance: 有限责任公司全体股东认缴的出资额应自公司成立之日起五年内缴足，增资的出资安排同样受该规则约束。
      basis:
        - 公司法第47条

  meso:
    - id: capital-valuation
      question: 投前估值与增资后股权比例的计算口径是否写清？
      risk: major
      guidance: 估值口径（投前或投后）差一个字，股权比例就差一大截，应写明计算公式与验资后的调整机制。
      party_notes:
        甲方: 应锁定投前估值并约定「投资款全部计入注册资本与资本公积」的分配，避免被稀释。
        乙方: 应明确溢价部分计入资本公积，并保留业绩未达标时的估值调整或回购触发。
      basis:
        - 公司法第227条

    - id: capital-conditions
      question: 交割先决条件是否齐备且可验证？
      risk: major
      guidance: 先决条件写得不可验证，等于没有条件；应逐项写明完成标志与证明文件。
      basis:
        - 公司法第227条

    - id: capital-existing-debt
      question: 公司既有债务、担保与或有负债是否已披露并安排处理？
      risk: fatal
      guidance: 未披露债务会直接侵蚀投资价值，应以披露清单加陈述保证加赔偿机制三层覆盖。
      basis:
        - 公司法第47条

  micro:
    - id: capital-governance
      question: 交割后的治理安排是否落地（董事席位、一票否决、信息权）？
      risk: major
      guidance: 治理条款若只写意向而无章程配合与违约救济，实际难以执行。
      basis:
        - 公司法第227条

    - id: capital-repurchase
      question: 回购与估值调整条款的触发条件是否明确、可执行？
      risk: major
      guidance: 触发条件应量化且由可取得的财务数据支撑；仅写「业绩未达预期」会无法落地。
      basis:
        - 公司法第227条

    - id: capital-use
      question: 增资款的用途与监管是否约定？是否设共管账户？
      risk: minor
      guidance: 用途约定加分期拨付，是防止资金被挪用的低成本手段。
      basis:
        - 公司法第47条

clauses:
  - name: 增资方案与股权比例条款
    required: true
    keywords: [增资, 新增注册资本, 股权比例]
    aliases: [认购新增资本, 增资后持股比例]
    elements:
      - 投前估值与投后估值
      - 增资金额与计入注册资本、资本公积的分配
      - 增资后各股东的持股比例
      - 计算公式与尾差处理
    issues:
      - 投前投后未区分，比例算错
      - 未写明溢价部分计入资本公积
    redline: |
      公司以投前估值人民币【】元为基础增加注册资本，投资人以人民币【】元认购新增注册资本人民币【】元，其中人民币【】元计入注册资本，剩余人民币【】元计入公司资本公积。增资完成后，公司注册资本由人民币【】元增至人民币【】元，投资人持股比例为【】%。各方持股比例以交割日经核验的实缴情况为准，尾差按四舍五入处理并书面确认。
    basis:
      - 公司法第227条

  - name: 优先认缴权处理条款
    required: true
    keywords: [优先认缴, 放弃优先认缴, 优先认购]
    aliases: [优先认缴权, 放弃优先认购权]
    elements:
      - 各原股东放弃优先认缴权的书面声明
      - 声明作为协议附件
      - 未放弃部分的处理
    issues:
      - 未取得全体原股东的书面放弃
      - 只写「原股东同意增资」，未触及优先认缴权
    redline: |
      公司全体原股东特此确认：就本次增资，各原股东在同等条件下享有的优先认缴权，均由其以附件《放弃优先认缴权声明》明确放弃；未出具该声明的，视为未放弃，投资人有权中止交割直至该等声明齐备。原股东放弃优先认缴权不影响其在后续增资中依法享有的权利。
    basis:
      - 公司法第227条

  - name: 出资期限与缴付条款
    required: true
    keywords: [出资期限, 缴付, 实缴]
    aliases: [缴纳出资, 缴足]
    elements:
      - 出资方式与出资期限
      - 分期缴付的节点
      - 逾期缴付的违约责任
    issues:
      - 出资期限超过法定五年上限
      - 未约定逾期缴付的后果
    redline: |
      投资人应于本协议生效之日起【】日内一次性缴付全部增资款；分期缴付的，各期金额与时间为：【安排】。全体股东认缴的出资额应自公司成立之日起五年内缴足，本次新增资本的出资安排不得违反该期限要求。投资人逾期缴付的，每逾期一日按未缴金额的【万分之五】支付违约金，逾期超过【三十】日的，公司有权解除本协议并要求赔偿损失。
    basis:
      - 公司法第47条

  - name: 陈述保证与披露条款
    required: true
    keywords: [陈述与保证, 披露, 或有负债]
    aliases: [保证条款, 披露清单]
    elements:
      - 主体资格与授权的保证
      - 财务与债务的披露清单
      - 未披露债务的赔偿机制
      - 保证的存续期间
    issues:
      - 未附披露清单，保证空泛
      - 未约定未披露债务的赔偿
    redline: |
      公司与原股东就附件《披露清单》所列事项向投资人作出陈述与保证，保证其真实、完整、准确。除《披露清单》已列明者外，公司不存在其他债务、担保、诉讼、仲裁或行政处罚。交割后发现未披露债务的，由原股东按投资人的持股比例向投资人承担赔偿责任，保证期间自交割之日起【三】年。
    basis:
      - 公司法第47条

  - name: 交割先决条件条款
    required: true
    keywords: [先决条件, 交割条件, 交割]
    aliases: [前提条件, 成交条件]
    elements:
      - 股东会决议与章程修改
      - 放弃优先认缴权声明齐备
      - 陈述保证在交割日仍真实
      - 条件未满足时的中止与解除
    issues:
      - 条件写得不可验证
      - 未约定条件未满足的处理
    redline: |
      投资人缴付增资款以下列条件全部满足或被投资人书面豁免为先决条件：（一）公司股东会已作出同意本次增资的有效决议；（二）全体原股东已出具《放弃优先认缴权声明》；（三）公司章程已完成相应修改或已形成待生效的修正案；（四）陈述与保证在交割日仍真实、完整。任一条件在【三十】日内未满足的，投资人有权中止交割或解除本协议，且不承担违约责任。
    basis:
      - 公司法第227条

red_flags:
  - id: capital-no-preemptive-handling
    name: 未处理原股东优先认缴权
    patterns: [原股东同意本次增资, 全体股东同意增资]
    risk: fatal
    message: 只写股东同意增资而未触及优先认缴权的放弃，增资决议与协议都可能被主张程序瑕疵。
    basis:
      - 公司法第227条

  - id: capital-contribution-too-long
    name: 出资期限超出五年
    patterns: [十年内缴足, 十五年内缴足, 二十年内缴足]
    risk: major
    message: 有限责任公司股东认缴的出资额应自公司成立之日起五年内缴足，超出该期限的安排存在合规风险。
    basis:
      - 公司法第47条
