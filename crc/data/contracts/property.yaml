type: property
label: 物业服务合同
category: 服务类
summary: 物业服务人在物业服务区域内提供维修养护、环境卫生与秩序维护，业主支付物业费。

legal_basis:
  - 民法典第937条
  - 民法典第938条

checks:
  macro:
    - id: property-subject
      question: 签约主体是否适格？是业主委员会、业主大会还是建设单位？
      risk: fatal
      guidance: 前期物业服务由建设单位订立，业主入住后由业主共同决定选聘；签约主体不适格会影响合同对业主的约束力。
      basis:
        - 民法典第937条

    - id: property-scope
      question: 物业服务区域是否界定清楚？红线与共用部位是否明确？
      risk: major
      guidance: 区域边界不清会直接引发收费与责任的争议，应以附图加四至描述锁定。
      basis:
        - 民法典第937条

  meso:
    - id: property-form
      question: 是否采用书面形式？是否包含法律列举的各项内容？
      risk: major
      guidance: 物业服务合同应当采用书面形式，内容一般包括服务事项、服务质量、费用标准与收取办法、维修资金使用、服务用房、服务期限与交接。
      basis:
        - 民法典第938条

    - id: property-commitment
      question: 物业服务人公开作出的服务承诺是否已纳入合同？
      risk: minor
      guidance: 公开作出的有利于业主的服务承诺，依法为物业服务合同的组成部分，应写入合同或附件以免举证困难。
      party_notes:
        甲方: 作为业主方，应把招商时的承诺逐条落到附件，口头承诺难以举证。
        乙方: 作为物业服务人，宣传口径应可兑现，避免承诺被当然认定为合同内容而超出成本承受范围。
      basis:
        - 民法典第938条

    - id: property-term
      question: 服务期限与续聘、解聘的衔接是否明确？
      risk: major
      guidance: 服务期限届满未续聘也未另聘的，容易形成事实服务关系，费用与责任口径都会悬空。
      basis:
        - 民法典第938条

  micro:
    - id: property-standard
      question: 服务质量标准是否可考核？是否有量化指标与考核周期？
      risk: major
      guidance: 服务标准写成「提供优质服务」无法考核，应落到频次、响应时间、完好率等可核查指标。
      party_notes:
        甲方: 标准应量化并挂钩费用扣减，否则只能靠事后争执。
        乙方: 标准过严会形成持续违约风险，宜区分基础服务与增值服务并设合理容错。
      basis:
        - 民法典第938条

    - id: property-fee
      question: 物业费的标准、收取办法与调整机制是否明确？
      risk: major
      guidance: 费用的收取办法与调整条件需写明，单方调价在实践中争议最集中。
      basis:
        - 民法典第938条

    - id: property-fund
      question: 维修资金的使用条件与程序是否约定？
      risk: major
      guidance: 维修资金属业主共有，使用须依法经业主共同决定，程序缺失会导致支出无法列支。
      basis:
        - 民法典第938条

    - id: property-handover
      question: 服务交接条款是否齐备？期满或解聘时的资料与设施移交是否约定？
      risk: major
      guidance: 交接是最易失控的环节，应写明资料清单、查验程序与逾期交接的责任。
      basis:
        - 民法典第938条

clauses:
  - name: 服务区域与服务事项条款
    required: true
    keywords: [服务区域, 服务事项, 物业服务区域]
    aliases: [管理区域, 服务范围]
    elements:
      - 四至范围与附图
      - 共用部位与共用设施清单
      - 服务事项的逐项列举
    issues:
      - 区域边界只有文字描述，无附图
      - 服务事项笼统写「日常管理」
    redline: |
      物业服务区域为【项目名称】，四至范围为东至【】、南至【】、西至【】、北至【】，具体以附件一《物业服务区域图》为准。物业服务事项包括：（一）建筑物及其附属设施的维修养护；（二）公共区域的环境卫生；（三）公共秩序的维护与车辆停放管理；（四）绿化养护；（五）【其他事项】。共用部位与共用设施清单见附件二。
    basis:
      - 民法典第937条

  - name: 服务质量与考核条款
    required: true
    keywords: [服务质量, 服务标准, 考核]
    aliases: [质量标准, 考核办法]
    elements:
      - 各项服务的频次与响应时间
      - 设备完好率等量化指标
      - 考核周期与不达标的处理
    issues:
      - 标准笼统，无法考核
      - 未挂钩费用扣减
    redline: |
      物业服务人应达到下列标准：公共区域清扫每日不少于【二】次；电梯故障接到报修后【三十】分钟内到场；共用设施设备完好率不低于【百分之九十五】；秩序维护实行【二十四】小时值守。业主方每【季度】组织一次考核，考核不达标的，按当季物业服务费的【百分之五】扣减，连续两个考核期不达标的，业主方有权解除合同。
    basis:
      - 民法典第938条

  - name: 物业服务费条款
    required: true
    keywords: [物业服务费, 物业费, 收费标准]
    aliases: [物业费用, 收取办法]
    elements:
      - 计费方式与单价
      - 缴纳周期与逾期处理
      - 费用调整的条件与程序
    issues:
      - 未约定费用调整程序
      - 空置房与车位费用的口径未写
    redline: |
      物业服务费按建筑面积计收，标准为每月每平方米人民币【】元；车位服务费为每个每月人民币【】元。业主应于每月【十】日前缴纳，逾期按日加收未缴金额的【万分之三】作为违约金。物业服务费标准需调整的，须经【业主共同决定/双方协商】并提前【三十】日公示，未经该程序的不得单方提价。
    basis:
      - 民法典第938条

  - name: 维修资金使用条款
    required: true
    keywords: [维修资金, 专项维修资金, 公共收益]
    aliases: [维修基金, 共有部分收益]
    elements:
      - 资金归属与账户管理
      - 使用的条件与表决程序
      - 公共收益的分配与公示
    issues:
      - 未约定使用的表决程序
      - 公共收益分配未约定
    redline: |
      建筑物及其附属设施的维修资金属于业主共有，专项用于共用部位、共用设施设备的维修、更新和改造，使用时依法经业主共同决定并按规定程序办理。利用共用部位、共用设施设备经营所得收益归业主共有，扣除合理成本后用于补充维修资金或按业主共同决定使用，收支情况每【半年】公示一次。
    basis:
      - 民法典第938条

  - name: 服务交接条款
    required: true
    keywords: [交接, 移交, 查验]
    aliases: [服务交接, 资料移交]
    elements:
      - 交接的触发情形与时限
      - 移交资料与物品清单
      - 设施查验与损坏的责任
      - 逾期交接的违约责任
    issues:
      - 未约定交接清单
      - 未约定逾期交接的责任
    redline: |
      本合同终止、解除或服务期限届满的，物业服务人应在【十五】日内完成交接，移交下列资料与物品：（一）竣工图纸与设施设备技术资料；（二）维修、保养与巡检记录；（三）物业服务费与公共收益账册；（四）预收的费用结余；（五）物业服务用房及配置物品。双方应共同查验并签署交接确认书；逾期交接的，每逾期一日按上月物业服务费的【百分之一】支付违约金。
    basis:
      - 民法典第938条

red_flags:
  - id: property-unilateral-price
    name: 物业服务人可单方调价
    patterns: [有权自行调整收费标准, 可根据成本自行调价, 单方面调整物业费]
    risk: major
    message: 物业服务费标准的调整涉及业主共同决定事项，约定由物业服务人单方调价通常不能约束业主。
    basis:
      - 民法典第938条

  - id: property-blanket-disclaimer
    name: 对人身财产损害全面免责
    patterns: [不承担任何责任, 概不负责, 免除全部责任]
    risk: fatal
    message: 物业服务人对共用部位安全隐患致害的责任不能通过格式条款一概免除，此类约定效力存疑。
    basis:
      - 民法典第496条
