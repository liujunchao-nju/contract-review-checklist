type: nda
label: 保密协议
category: 基础
summary: 一方或双方就特定信息负保密义务，常见于合作洽谈、尽调与用工场景。

legal_basis:
  - 民法典第501条
  - 民法典第509条
  - 合同编通则解释第15条

checks:
  macro:
    - id: nda-nature
      question: 名为保密协议，实际是否夹带竞业限制、不招揽或排他合作义务？
      risk: major
      guidance: 裁判按合同内容而非名称认定关系，名为保密实为竞业限制的安排会适用另一套规则，义务边界完全不同。
      party_notes:
        甲方: 作为披露方，夹带义务对我方有利，但要防范整体被认定为格式条款而提示义务未履行。
        乙方: 作为接收方，重点核对是否夹带竞业限制或不招揽；有这类内容的，须单独谈对价与期限。
      risk_by_party:
        乙方: fatal
      basis:
        - 合同编通则解释第15条

    - id: nda-subject
      question: 双方主体是否写全称？披露方对保密信息的权属是否有瑕疵？
      risk: minor
      guidance: 主体名称不一致会在维权时找不到适格被告；披露方对信息不享有权利的，保密约定无从谈起。
      basis:
        - 民法典第501条

  meso:
    - id: nda-form
      question: 是否采用书面形式？生效条件与份数是否写明？
      risk: minor
      guidance: 依法成立的合同自成立时生效；签署方式与生效节点不明，会在举证时产生争议。
      basis:
        - 民法典第502条

    - id: nda-term-start
      question: 保密期限是否写明起算点？合同终止后是否延续？
      risk: major
      guidance: 未约定合同终止后是否继续保密，是保密协议最常见的漏项，等于把期限缩到合同存续期内。
      basis:
        - 民法典第509条

    - id: nda-remedy
      question: 违约救济是否可落地？损失难以举证时是否约定了违约金？
      risk: major
      guidance: 保密违约的损失通常难以量化，事先约定合理违约金或最低赔偿额，可显著降低举证成本。
      party_notes:
        甲方: 违约金对我方有利，但畸高会被调减，宜与信息价值匹配并保留举证空间。
        乙方: 警惕无上限赔偿与概括性违约金，应争取以实际损失为限并设置上限。
      basis:
        - 民法典第585条

  micro:
    - id: nda-definition
      question: 保密信息的定义是否可识别？范围是否过宽到涵盖一切信息？
      risk: fatal
      guidance: 定义过宽会导致任何交谈都构成违约，既不公平也难以执行，宜以「标明保密」加「合理人应知」为界。
      party_notes:
        甲方: 定义可稍宽，但应保留「标明或书面确认」的口径，避免整份协议因不可执行被否定。
        乙方: 定义过宽对我方极不利，须坚持列举加标明的双重要件，并写入口头披露的书面确认程序。
      basis:
        - 民法典第501条

    - id: nda-exclusions
      question: 例外情形是否齐备（已公开、独立开发、合法取得、法定披露）？
      risk: major
      guidance: 缺少例外情形的保密义务近乎无限，接收方的正常经营活动会被架空。
      basis:
        - 民法典第501条

    - id: nda-return
      question: 是否约定了载体返还、销毁与留档例外？
      risk: minor
      guidance: 只写返还不写销毁，电子副本无法处理；应同时允许为合规留档保留一份并注明用途。
      basis:
        - 民法典第509条

clauses:
  - name: 保密信息定义条款
    required: true
    keywords: [保密信息, 商业秘密, 保密资料]
    aliases: [机密信息, 专有信息]
    elements:
      - 保密信息的载体形式（书面、口头、电子）
      - 标明或书面确认的程序
      - 不属于保密信息的情形
    issues:
      - 定义为「一切信息」，范围过宽
      - 口头披露未约定事后书面确认
    redline: |
      本协议所称保密信息，指披露方以书面、电子形式提供并标明「保密」的资料，以及以口头方式提供、并在披露后【三】个工作日内由披露方以书面方式确认的信息。下列信息不属于保密信息：（一）接收方在披露前已合法持有的；（二）非因接收方违反本协议而已进入公共领域的；（三）接收方独立开发且有充分证据证明的；（四）接收方从无保密义务的第三方合法取得的。
    basis:
      - 民法典第501条

  - name: 保密义务与范围条款
    required: true
    keywords: [保密义务, 不得披露, 保密责任]
    aliases: [负有保密义务, 不得向第三方]
    elements:
      - 不得披露、不得使用的双重义务
      - 可接触人员范围与「知悉必要」限制
      - 对关联方与外聘机构的传导义务
    issues:
      - 只写不得披露，未写不得使用
      - 未限制可接触人员的范围
    redline: |
      接收方应对保密信息严格保密，除为实现本次合作目的且确有知悉必要的人员外，不得向任何第三方披露，亦不得将保密信息用于本次合作以外的任何用途。接收方向其关联方、外聘顾问披露的，应事先取得披露方书面同意，并使该等主体承担不低于本协议标准的保密义务，接收方就其行为向披露方承担责任。
    basis:
      - 民法典第501条
      - 民法典第509条

  - name: 例外与免责条款
    required: true
    keywords: [例外, 不属于保密信息, 已公开]
    aliases: [除外情形, 不受本协议限制]
    elements:
      - 已公开或进入公共领域
      - 独立开发与合法第三方取得
      - 法律法规或司法程序要求披露
      - 依法披露时的预先通知义务
    issues:
      - 完全没有例外情形
      - 法定披露未约定通知披露方的义务
    redline: |
      下列情形不构成违约：（一）保密信息非因接收方原因已公开或进入公共领域；（二）接收方独立开发并有充分证据证明；（三）接收方自无保密义务的第三方合法取得；（四）依法律法规、监管要求或司法、仲裁程序须予披露。属于第（四）项的，接收方应在法律允许范围内事先通知披露方，并将披露范围限于依法必需的最小部分。
    basis:
      - 民法典第501条

  - name: 保密期限与延续条款
    required: true
    keywords: [保密期限, 保密义务持续, 有效期]
    aliases: [继续保密, 保密义务不因]
    elements:
      - 期限长度与起算点
      - 合同终止或解除后是否延续
      - 商业秘密在其成为公开信息前的持续保护
    issues:
      - 未约定合同终止后是否延续
      - 起算点写成「自签署之日起」但未约定终止后
    redline: |
      本协议项下的保密义务自接收方知悉保密信息之日起持续【三】年；本协议终止或解除后，保密义务继续有效至上述期限届满。就构成商业秘密的信息，保密义务持续至该信息合法进入公共领域之日止。
    basis:
      - 民法典第509条

  - name: 返还与销毁条款
    required: false
    keywords: [返还, 销毁, 删除]
    aliases: [交还, 清除]
    elements:
      - 载体返还或销毁的期限
      - 电子副本与备份的处理
      - 为合规留档保留一份的例外
      - 销毁证明的提供
    issues:
      - 只写返还未写电子副本处理
      - 未允许为合规留档保留一份
    redline: |
      本协议终止或经披露方请求后【十】个工作日内，接收方应返还或销毁全部保密信息载体，包括电子副本与备份，并向披露方出具书面销毁证明。接收方为遵守法律法规或内部合规要求需留存一份的，可留存一份并仅用于该等目的，仍受本协议保密义务约束。
    basis:
      - 民法典第509条

red_flags:
  - id: nda-perpetual
    name: 永久保密义务
    patterns: [永久保密, 无限期保密, 长期保密, 永久承担保密义务]
    risk: minor
    message: 无期限的保密义务在部分裁判中会被认为过分加重负担，宜设定期限并另就商业秘密约定持续保护。
    basis:
      - 民法典第496条

  - id: nda-no-exclusion
    name: 不设任何例外情形
    patterns: [不设例外, 无任何例外, 全部信息均属保密信息]
    risk: major
    message: 缺少例外情形意味着接收方独立开发的成果也可能被认定为违约，范围显失公平。
    basis:
      - 民法典第501条

  - id: nda-residual-broad
    name: 残余记忆条款过宽
    patterns: [残余记忆, 记忆中的信息, 留存于记忆中的]
    risk: minor
    message: 以「记忆中的信息」施加义务，边界模糊且难以举证，宜限定为可识别的技术秘密或经营信息。
    basis:
      - 民法典第496条
