note: >
  条号与条文内容一一对应，均已确认现行有效。凡引用本库以外的法条，
  一律视为未核验，不得进入清单。

laws:
  # ── 民法典 · 总则与合同通则 ────────────────────────────────
  - key: 民法典第143条
    law: 中华人民共和国民法典
    article: 143
    title: 民事法律行为有效的三项条件
    text: "具备下列条件的民事法律行为有效：（一）行为人具有相应的民事行为能力；（二）意思表示真实；（三）不违反法律、行政法规的强制性规定，不违背公序良俗。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第153条
    law: 中华人民共和国民法典
    article: 153
    title: 违反强制性规定或违背公序良俗的民事法律行为无效
    text: "违反法律、行政法规的强制性规定的民事法律行为无效。但是，该强制性规定不导致该民事法律行为无效的除外。违背公序良俗的民事法律行为无效。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第465条
    law: 中华人民共和国民法典
    article: 465
    title: 依法成立的合同受法律保护
    text: "依法成立的合同，受法律保护。依法成立的合同，仅对当事人具有法律约束力，但是法律另有规定的除外。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第470条
    law: 中华人民共和国民法典
    article: 470
    title: 合同内容的一般条款
    text: "合同的内容由当事人约定，一般包括下列条款：（一）当事人的姓名或者名称和住所；（二）标的；（三）数量；（四）质量；（五）价款或者报酬；（六）履行期限、地点和方式；（七）违约责任；（八）解决争议的方法。当事人可以参照各类合同的示范文本订立合同。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第496条
    law: 中华人民共和国民法典
    article: 496
    title: 格式条款的定义与提示说明义务
    text: "格式条款是当事人为了重复使用而预先拟定，并在订立合同时未与对方协商的条款。采用格式条款订立合同的，提供格式条款的一方应当遵循公平原则确定当事人之间的权利和义务，并采取合理的方式提示对方注意免除或者减轻其责任等与对方有重大利害关系的条款，按照对方的要求，对该条款予以说明。提供格式条款的一方未履行提示或者说明义务，致使对方没有注意或者理解与其有重大利害关系的条款的，对方可以主张该条款不成为合同的内容。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第502条
    law: 中华人民共和国民法典
    article: 502
    title: 合同的生效与批准手续
    text: "依法成立的合同，自成立时生效，但是法律另有规定或者当事人另有约定的除外。依照法律、行政法规的规定，合同应当办理批准等手续的，依照其规定。未办理批准等手续影响合同生效的，不影响合同中履行报批等义务条款以及相关条款的效力。应当办理申请批准等手续的当事人未履行义务的，对方可以请求其承担违反该义务的责任。依照法律、行政法规的规定，合同的变更、转让、解除等情形应当办理批准等手续的，适用前款规定。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第509条
    law: 中华人民共和国民法典
    article: 509
    title: 全面履行义务与诚信原则
    text: "当事人应当按照约定全面履行自己的义务。当事人应当遵循诚信原则，根据合同的性质、目的和交易习惯履行通知、协助、保密等义务。当事人在履行合同过程中，应当避免浪费资源、污染环境和破坏生态。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第533条
    law: 中华人民共和国民法典
    article: 533
    title: 情势变更：重新协商与请求变更或解除
    text: "合同成立后，合同的基础条件发生了当事人在订立合同时无法预见的、不属于商业风险的重大变化，继续履行合同对于当事人一方明显不公平的，受不利影响的当事人可以与对方重新协商；在合理期限内协商不成的，当事人可以请求人民法院或者仲裁机构变更或者解除合同。人民法院或者仲裁机构应当结合案件的实际情况，根据公平原则变更或者解除合同。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第563条
    law: 中华人民共和国民法典
    article: 563
    title: 法定解除的五种情形
    text: "有下列情形之一的，当事人可以解除合同：（一）因不可抗力致使不能实现合同目的；（二）在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务；（三）当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；（四）当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；（五）法律规定的其他情形。以持续履行的债务为内容的不定期合同，当事人可以随时解除合同，但是应当在合理期限之前通知对方。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第577条
    law: 中华人民共和国民法典
    article: 577
    title: 违约责任的一般形态
    text: "当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行、采取补救措施或者赔偿损失等违约责任。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第584条
    law: 中华人民共和国民法典
    article: 584
    title: 损失赔偿范围与可预见性规则
    text: "当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过违约一方订立合同时预见到或者应当预见到的因违约可能造成的损失。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第585条
    law: 中华人民共和国民法典
    article: 585
    title: 违约金的约定与司法调整
    text: "当事人可以约定一方违约时应当根据违约情况向对方支付一定数额的违约金，也可以约定因违约产生的损失赔偿额的计算方法。约定的违约金低于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以增加；约定的违约金过分高于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以适当减少。当事人就迟延履行约定违约金的，违约方支付违约金后，还应当履行债务。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第590条
    law: 中华人民共和国民法典
    article: 590
    title: 不可抗力免责与通知、证明义务
    text: "当事人一方因不可抗力不能履行合同的，根据不可抗力的影响，部分或者全部免除责任，但是法律另有规定的除外。因不可抗力不能履行合同的，应当及时通知对方，以减轻可能给对方造成的损失，并应当在合理期限内提供证明。当事人迟延履行后发生不可抗力的，不免除其违约责任。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第646条
    law: 中华人民共和国民法典
    article: 646
    title: 其他有偿合同参照适用买卖合同规定
    text: "法律对其他有偿合同有规定的，依照其规定；没有规定的，参照适用买卖合同的有关规定。"
    effective_from: "2021-01-01"
    authority: 法律

  # ── 民法典 · 典型合同 ────────────────────────────────────
  - key: 民法典第595条
    law: 中华人民共和国民法典
    article: 595
    title: 买卖合同的定义
    text: "买卖合同是出卖人转移标的物的所有权于买受人，买受人支付价款的合同。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第596条
    law: 中华人民共和国民法典
    article: 596
    title: 买卖合同的一般条款
    text: "买卖合同的内容一般包括标的物的名称、数量、质量、价款、履行期限、履行地点和方式、包装方式、检验标准和方法、结算方式、合同使用的文字及其效力等条款。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第604条
    law: 中华人民共和国民法典
    article: 604
    title: 标的物毁损灭失风险的转移
    text: "标的物毁损、灭失的风险，在标的物交付之前由出卖人承担，交付之后由买受人承担，但是法律另有规定或者当事人另有约定的除外。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第615条
    law: 中华人民共和国民法典
    article: 615
    title: 按约定质量要求交付标的物
    text: "出卖人应当按照约定的质量要求交付标的物。出卖人提供有关标的物质量说明的，交付的标的物应当符合该说明的质量要求。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第621条
    law: 中华人民共和国民法典
    article: 621
    title: 检验期限与怠于通知的后果
    text: "当事人约定检验期限的，买受人应当在检验期限内将标的物的数量或者质量不符合约定的情形通知出卖人。买受人怠于通知的，视为标的物的数量或者质量符合约定。当事人没有约定检验期限的，买受人应当在发现或者应当发现标的物的数量或者质量不符合约定的合理期限内通知出卖人。买受人在合理期限内未通知或者自收到标的物之日起二年内未通知出卖人的，视为标的物的数量或者质量符合约定；但是，对标的物有质量保证期的，适用质量保证期，不适用该二年的规定。出卖人知道或者应当知道提供的标的物不符合约定的，买受人不受前两款规定的通知时间的限制。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第626条
    law: 中华人民共和国民法典
    article: 626
    title: 买受人支付价款的义务
    text: "买受人应当按照约定的数额和支付方式支付价款。对价款的数额和支付方式没有约定或者约定不明确的，适用本法第五百一十条、第五百一十一条第二项和第五项的规定。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第667条
    law: 中华人民共和国民法典
    article: 667
    title: 借款合同的定义
    text: "借款合同是借款人向贷款人借款，到期返还借款并支付利息的合同。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第680条
    law: 中华人民共和国民法典
    article: 680
    title: 禁止高利放贷与利息约定不明
    text: "禁止高利放贷，借款的利率不得违反国家有关规定。借款合同对支付利息没有约定的，视为没有利息。借款合同对支付利息约定不明确，当事人不能达成补充协议的，按照当地或者当事人的交易方式、交易习惯、市场利率等因素确定利息；自然人之间借款的，视为没有利息。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第703条
    law: 中华人民共和国民法典
    article: 703
    title: 租赁合同的定义
    text: "租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第704条
    law: 中华人民共和国民法典
    article: 704
    title: 租赁合同的一般条款
    text: "租赁合同的内容一般包括租赁物的名称、数量、用途、租赁期限、租金及其支付期限和方式、租赁物维修等条款。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第705条
    law: 中华人民共和国民法典
    article: 705
    title: 租赁期限不得超过二十年
    text: "租赁期限不得超过二十年。超过二十年的，超过部分无效。租赁期限届满，当事人可以续订租赁合同；但是，约定的租赁期限自续订之日起不得超过二十年。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第707条
    law: 中华人民共和国民法典
    article: 707
    title: 六个月以上租赁应当采用书面形式
    text: "租赁期限六个月以上的，应当采用书面形式。当事人未采用书面形式，无法确定租赁期限的，视为不定期租赁。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第716条
    law: 中华人民共和国民法典
    article: 716
    title: 转租须经出租人同意
    text: "承租人经出租人同意，可以将租赁物转租给第三人。承租人转租的，承租人与出租人之间的租赁合同继续有效；第三人造成租赁物损失的，承租人应当赔偿损失。承租人未经出租人同意转租的，出租人可以解除合同。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第721条
    law: 中华人民共和国民法典
    article: 721
    title: 租金的支付期限
    text: "承租人应当按照约定的期限支付租金。对支付租金的期限没有约定或者约定不明确，依据本法第五百一十条的规定仍不能确定，租赁期限不满一年的，应当在租赁期限届满时支付；租赁期限一年以上的，应当在每届满一年时支付，剩余期限不满一年的，应当在租赁期限届满时支付。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第725条
    law: 中华人民共和国民法典
    article: 725
    title: 买卖不破租赁
    text: "租赁物在承租人按照租赁合同占有期限内发生所有权变动的，不影响租赁合同的效力。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第770条
    law: 中华人民共和国民法典
    article: 770
    title: 承揽合同的定义
    text: "承揽合同是承揽人按照定作人的要求完成工作，交付工作成果，定作人支付报酬的合同。承揽包括加工、定作、修理、复制、测试、检验等工作。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第789条
    law: 中华人民共和国民法典
    article: 789
    title: 建设工程合同应当采用书面形式
    text: "建设工程合同应当采用书面形式。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第788条
    law: 中华人民共和国民法典
    article: 788
    title: 建设工程合同的定义
    text: "建设工程合同是承包人进行工程建设，发包人支付价款的合同。建设工程合同包括工程勘察、设计、施工合同。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第791条
    law: 中华人民共和国民法典
    article: 791
    title: 禁止转包与违法分包
    text: "发包人可以与总承包人订立建设工程合同，也可以分别与勘察人、设计人、施工人订立勘察、设计、施工承包合同。发包人不得将应当由一个承包人完成的建设工程支解成若干部分发包给数个承包人。总承包人或者勘察、设计、施工承包人经发包人同意，可以将自己承包的部分工作交由第三人完成。第三人就其完成的工作成果与总承包人或者勘察、设计、施工承包人向发包人承担连带责任。承包人不得将其承包的全部建设工程转包给第三人或者将其承包的全部建设工程支解以后以分包的名义分别转包给第三人。禁止承包人将工程分包给不具备相应资质条件的单位。禁止分包单位将其承包的工程再分包。建设工程主体结构的施工必须由承包人自行完成。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第807条
    law: 中华人民共和国民法典
    article: 807
    title: 建设工程价款的优先受偿权
    text: "发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第843条
    law: 中华人民共和国民法典
    article: 843
    title: 技术合同的定义
    text: "技术合同是当事人就技术开发、转让、许可、咨询或者服务订立的确立相互之间权利和义务的合同。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第851条
    law: 中华人民共和国民法典
    article: 851
    title: 技术开发合同的定义与书面形式要求
    text: "技术开发合同是当事人之间就新技术、新产品、新工艺、新品种或者新材料及其系统的研究开发所订立的合同。技术开发合同包括委托开发合同和合作开发合同。技术开发合同应当采用书面形式。当事人之间就具有实用价值的科技成果实施转化订立的合同，参照适用技术开发合同的有关规定。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第859条
    law: 中华人民共和国民法典
    article: 859
    title: 委托开发成果申请专利的权利归属
    text: "委托开发完成的发明创造，除法律另有规定或者当事人另有约定外，申请专利的权利属于研究开发人。研究开发人取得专利权的，委托人可以依法实施该专利。研究开发人转让专利申请权的，委托人享有以同等条件优先受让的权利。"
    effective_from: "2021-01-01"
    authority: 法律

  # ── 民法典合同编通则司法解释（法释〔2023〕13 号）──────────
  - key: 合同编通则解释第9条
    law: 最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释
    article: 9
    title: 不得仅以示范文本或未重复使用为由否认格式条款
    text: "合同条款符合民法典第四百九十六条第一款规定的情形，当事人仅以合同系依据合同示范文本制作或者双方已经明确约定合同条款不属于格式条款为由主张该条款不是格式条款的，人民法院不予支持。从事经营活动的当事人一方仅以未实际重复使用为由主张其预先拟定且未与对方协商的合同条款不是格式条款的，人民法院不予支持。但是，有证据证明该条款不是为了重复使用而预先拟定的除外。"
    effective_from: "2023-12-05"
    authority: 司法解释

  - key: 合同编通则解释第14条
    law: 最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释
    article: 14
    title: 同一交易订立多份合同与虚假意思表示
    text: "当事人之间就同一交易订立多份合同，人民法院应当认定其中以虚假意思表示订立的合同无效。当事人为规避法律、行政法规的强制性规定，以虚假意思表示隐藏真实意思表示的，人民法院应当依据民法典第一百五十三条第一款的规定认定被隐藏合同的效力；当事人为规避法律、行政法规关于合同应当办理批准等手续的规定，以虚假意思表示隐藏真实意思表示的，人民法院应当依据民法典第五百零二条第二款的规定认定被隐藏合同的效力。依据前款规定认定被隐藏合同无效或者确定不发生效力的，人民法院应当以被隐藏合同为事实基础，依据民法典第一百五十七条的规定确定当事人的民事责任。但是，法律另有规定的除外。当事人就同一交易订立的多份合同均系真实意思表示，且不存在其他影响合同效力情形的，人民法院应当在查明各合同成立先后顺序和实际履行情况的基础上，认定合同内容是否发生变更。法律、行政法规禁止变更合同内容的，人民法院应当认定合同的相应变更无效。"
    effective_from: "2023-12-05"
    authority: 司法解释

  - key: 合同编通则解释第15条
    law: 最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释
    article: 15
    title: 按合同内容而非名称认定权利义务关系（名实不符）
    text: "人民法院认定当事人之间的权利义务关系，不应当拘泥于合同使用的名称，而应当根据合同约定的内容。当事人主张的权利义务关系与根据合同内容认定的权利义务关系不一致的，人民法院应当结合缔约背景、交易目的、交易结构、履行行为以及当事人是否存在虚构交易标的等事实认定当事人之间的实际民事法律关系。"
    effective_from: "2023-12-05"
    authority: 司法解释

  - key: 合同编通则解释第20条
    law: 最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释
    article: 20
    title: 越权代表的效力与相对人的合理审查义务
    text: "法律、行政法规为限制法人的法定代表人或者非法人组织的负责人的代表权，规定合同所涉事项应当由法人、非法人组织的权力机构或者决策机构决议，或者应当由法人、非法人组织的执行机构决定，法定代表人、负责人未取得授权而以法人、非法人组织的名义订立合同，未尽到合理审查义务的相对人主张该合同对法人、非法人组织发生效力并由其承担违约责任的，人民法院不予支持，但是法人、非法人组织有过错的，可以参照民法典第一百五十七条的规定判决其承担相应的赔偿责任。相对人已尽到合理审查义务，构成表见代表的，人民法院应当依据民法典第五百零四条的规定处理。合同所涉事项未超越法律、行政法规规定的法定代表人或者负责人的代表权限，但是超越法人、非法人组织的章程或者权力机构等对代表权的限制，相对人主张该合同对法人、非法人组织发生效力并由其承担违约责任的，人民法院依法予以支持。但是，法人、非法人组织举证证明相对人知道或者应当知道该限制的除外。"
    effective_from: "2023-12-05"
    authority: 司法解释

  - key: 合同编通则解释第32条
    law: 最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释
    article: 32
    title: 情势变更中「重大变化」的认定
    text: "合同成立后，因政策调整或者市场供求关系异常变动等原因导致价格发生当事人在订立合同时无法预见的、不属于商业风险的涨跌，继续履行合同对于当事人一方明显不公平的，人民法院应当认定合同的基础条件发生了民法典第五百三十三条第一款规定的「重大变化」。但是，合同涉及市场属性活跃、长期以来价格波动较大的大宗商品以及股票、期货等风险投资型金融产品的除外。当事人事先约定排除民法典第五百三十三条适用的，人民法院应当认定该约定无效。"
    effective_from: "2023-12-05"
    authority: 司法解释

  - key: 合同编通则解释第64条
    law: 最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释
    article: 64
    title: 请求调整违约金的举证责任
    text: "当事人一方通过反诉或者抗辩的方式，请求调整违约金的，人民法院依法予以支持。违约方主张约定的违约金过分高于违约造成的损失，请求予以适当减少的，应当承担举证责任。非违约方主张约定的违约金合理的，也应当提供相应的证据。当事人仅以合同约定不得对违约金进行调整为由主张不予调整违约金的，人民法院不予支持。"
    effective_from: "2023-12-05"
    authority: 司法解释

  - key: 合同编通则解释第65条
    law: 最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释
    article: 65
    title: 违约金过高的衡量标准（超过损失百分之三十）
    text: "当事人主张约定的违约金过分高于违约造成的损失，请求予以适当减少的，人民法院应当以民法典第五百八十四条规定的损失为基础，兼顾合同主体、交易类型、合同的履行情况、当事人的过错程度、履约背景等因素，遵循公平原则和诚信原则进行衡量，并作出裁判。约定的违约金超过造成损失的百分之三十的，人民法院一般可以认定为过分高于造成的损失。恶意违约的当事人一方请求减少违约金的，人民法院不予支持。"
    effective_from: "2023-12-05"
    authority: 司法解释

  - key: 合同编通则解释第66条
    law: 最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释
    article: 66
    title: 违约金调整的释明义务
    text: "当事人一方请求对方支付违约金，对方以合同不成立、无效、被撤销、确定不发生效力、不构成违约或者非违约方不存在损失等为由抗辩，未主张调整过高的违约金的，人民法院应当就若不支持该抗辩，当事人是否请求调整违约金进行释明。第一审人民法院认为抗辩成立且未予释明，第二审人民法院认为应当判决支付违约金的，可以直接释明，并根据当事人的请求，在当事人就是否应当调整违约金充分举证、质证、辩论后，依法判决适当减少违约金。"
    effective_from: "2023-12-05"
    authority: 司法解释

  # ── 劳动合同法（2012 修正）─────────────────────────────
  - key: 劳动合同法第10条
    law: 中华人民共和国劳动合同法
    article: 10
    title: 建立劳动关系应当订立书面劳动合同
    text: "建立劳动关系，应当订立书面劳动合同。已建立劳动关系，未同时订立书面劳动合同的，应当自用工之日起一个月内订立书面劳动合同。用人单位与劳动者在用工前订立劳动合同的，劳动关系自用工之日起建立。"
    effective_from: "2013-07-01"
    authority: 法律

  - key: 劳动合同法第17条
    law: 中华人民共和国劳动合同法
    article: 17
    title: 劳动合同的必备条款与约定条款
    text: "劳动合同应当具备以下条款：（一）用人单位的名称、住所和法定代表人或者主要负责人；（二）劳动者的姓名、住址和居民身份证或者其他有效身份证件号码；（三）劳动合同期限；（四）工作内容和工作地点；（五）工作时间和休息休假；（六）劳动报酬；（七）社会保险；（八）劳动保护、劳动条件和职业危害防护；（九）法律、法规规定应当纳入劳动合同的其他事项。劳动合同除前款规定的必备条款外，用人单位与劳动者可以约定试用期、培训、保守秘密、补充保险和福利待遇等其他事项。"
    effective_from: "2013-07-01"
    authority: 法律

  - key: 劳动合同法第19条
    law: 中华人民共和国劳动合同法
    article: 19
    title: 试用期期限的法定上限
    text: "劳动合同期限三个月以上不满一年的，试用期不得超过一个月；劳动合同期限一年以上不满三年的，试用期不得超过二个月；三年以上固定期限和无固定期限的劳动合同，试用期不得超过六个月。同一用人单位与同一劳动者只能约定一次试用期。以完成一定工作任务为期限的劳动合同或者劳动合同期限不满三个月的，不得约定试用期。试用期包含在劳动合同期限内。劳动合同仅约定试用期的，试用期不成立，该期限为劳动合同期限。"
    effective_from: "2013-07-01"
    authority: 法律

  - key: 劳动合同法第23条
    law: 中华人民共和国劳动合同法
    article: 23
    title: 保密义务与竞业限制的经济补偿
    text: "用人单位与劳动者可以在劳动合同中约定保守用人单位的商业秘密和与知识产权相关的保密事项。对负有保密义务的劳动者，用人单位可以在劳动合同或者保密协议中与劳动者约定竞业限制条款，并约定在解除或者终止劳动合同后，在竞业限制期限内按月给予劳动者经济补偿。劳动者违反竞业限制约定的，应当按照约定向用人单位支付违约金。"
    effective_from: "2013-07-01"
    authority: 法律

  - key: 劳动合同法第24条
    law: 中华人民共和国劳动合同法
    article: 24
    title: 竞业限制的人员范围与二年上限
    text: "竞业限制的人员限于用人单位的高级管理人员、高级技术人员和其他负有保密义务的人员。竞业限制的范围、地域、期限由用人单位与劳动者约定，竞业限制的约定不得违反法律、法规的规定。在解除或者终止劳动合同后，前款规定的人员到与本单位生产或者经营同类产品、从事同类业务的有竞争关系的其他用人单位，或者自己开业生产或者经营同类产品、从事同类业务的竞业限制期限，不得超过二年。"
    effective_from: "2013-07-01"
    authority: 法律

  # ── 公司法（2023 修订）─────────────────────────────────
  - key: 公司法第47条
    law: 中华人民共和国公司法
    article: 47
    title: 有限责任公司注册资本五年内缴足
    text: "有限责任公司的注册资本为在公司登记机关登记的全体股东认缴的出资额。全体股东认缴的出资额由股东按照公司章程的规定自公司成立之日起五年内缴足。法律、行政法规以及国务院决定对有限责任公司注册资本实缴、注册资本最低限额、股东出资期限另有规定的，从其规定。"
    effective_from: "2024-07-01"
    authority: 法律

  - key: 公司法第84条
    law: 中华人民共和国公司法
    article: 84
    title: 有限责任公司股权转让与其他股东优先购买权
    text: "有限责任公司的股东之间可以相互转让其全部或者部分股权。股东向股东以外的人转让股权的，应当将股权转让的数量、价格、支付方式和期限等事项书面通知其他股东，其他股东在同等条件下有优先购买权。股东自接到书面通知之日起三十日内未答复的，视为放弃优先购买权。两个以上股东行使优先购买权的，协商确定各自的购买比例；协商不成的，按照转让时各自的出资比例行使优先购买权。公司章程对股权转让另有规定的，从其规定。"
    effective_from: "2024-07-01"
    authority: 法律
