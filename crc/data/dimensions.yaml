framework: sanguan-sibu
label: 三观四步审查框架
version: 1

description: >
  审查合同不在条文数量，而在层次：先看交易结构能不能成立，再看合同形式能不能生效，
  最后才逐条抠文字。跳过前两层直接改字句是审查中最常见的失误：一份条款写得再漂亮，
  交易结构违规照样无效。

source: |
  框架取自《合同起草审查指南：三观四步法》（何力、常金光）的宏观—中观—微观分层思路，
  并作面向审查场景的改造：把「起草」的四步改写为「审查」的四步。
  法条依据一律以现行《民法典》（2021.1.1 施行）与《民法典合同编通则司法解释》
  （法释〔2023〕13 号，2023.12.5 施行）为准，条号逐条核对，见 data/laws.yaml。

steps:
  - id: stance
    order: 1
    label: 定立场
    question: 我代表哪一方？市场地位如何？本次审查要守住什么底线？
    outputs:
      - 审查视角（甲方 / 乙方 / 中立）
      - 谈判地位（强势 / 对等 / 弱势），决定哪些条款可谈、哪些必须守
      - 商业底线与法律红线（红线不可让，底线可换算方案）

dimensions:
  - id: macro
    order: 2
    label: 宏观
    scope: 交易结构
    question: 这笔交易本身能不能做、由谁做、要不要批？
    items:
      - 合同类型选择是否与交易实质相符
      - 主体是否适格、有无签约权限
      - 标的是否合法、可否流转
      - 是否涉及行政审批、备案、登记等交易程序
      - 交易结构是否触发强制性规定或公序良俗

  - id: meso
    order: 3
    label: 中观
    scope: 合同形式
    question: 这份合同能不能生效、好不好用？
    items:
      - 合同形式（书面 / 电子 / 需公证）
      - 合同成立与生效条件
      - 格式条款的提示与说明义务
      - 条款体系是否完整（必备条款齐不齐）
      - 合同语言的准确性与内部一致性

  - id: micro
    order: 4
    label: 微观
    scope: 条款文本
    question: 每一条写得对不对、全不全、能不能执行？
    items:
      - 逐条对照条款标准检查必备要素
      - 权利义务是否对等
      - 违约责任是否可量化、可执行
      - 争议解决与通知送达是否可落地

risk_levels:
  - id: fatal
    order: 1
    label: 致命
    definition: 必须修改，否则不建议签署。违反效力性强制性规定、标的违法、关键条款缺失致合同无法履行或目的落空。
  - id: major
    order: 2
    label: 重要
    definition: 强烈建议修改。权利义务显著失衡、救济手段不足、存在可预见的重大合规风险。
  - id: minor
    order: 3
    label: 一般
    definition: 可以协商修改。表述不清、标准不明、虽不影响效力但会抬高履约与举证成本。
  - id: note
    order: 4
    label: 提示
    definition: 可选优化。不影响效力与利益格局，属起草习惯与完备性上的改进空间。

discipline:
  - 每一条意见都要落到法条或条款标准上，不给无依据的「建议修改」。
  - 风险的定性取决于审查视角：同一条款对甲方是优势、对乙方就是风险，须先定立场。
  - 目标是把交易做成并控制风险，不是把交易谈死；提修改方案时同时给出可接受的替代方案。
  - 引用法条须为现行有效版本，条号与条文内容一致，不得凭记忆引用（由 laws.yaml 统一核验）。
