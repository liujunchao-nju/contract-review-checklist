name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Smoke test the CLI
        run: |
          python -m crc verify
          python -m crc list
          python -m crc show --type sales
          python -m crc checklist --type sales | head -20
          python -m crc laws --key 民法典第585条
          python -m crc audit --type sales --file examples/contract_sample.md
