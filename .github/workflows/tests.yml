name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Smoke test the CLI
        run: |
          python -m crc verify
          python -m crc list
          python -m crc show --type nda
          python -m crc checklist --type sales | head -20
          python -m crc checklist --type guarantee --party 甲方 --format html > /tmp/cl.html
          python -m crc laws --key 民法典第585条
          python -m crc bench
          python -m crc bench --key penalty-ratio
          # audit 检出缺失条款时按设计返回 1（示例合同刻意留了缺口），此处只验证命令可运行
          python -m crc audit --type sales --file examples/contract_sample.md || true
          python -m crc audit --type sales --file examples/contract_sample.md --json | head -5
          python -m crc audit --type sales --file examples/contract_sample.md --format html > /tmp/au.html || true
          python -m crc audit --type lease --file examples/contract_sample.md --party 乙方 --no-bench || true

      - name: HTML 产物不得引用外部资源
        run: |
          ! grep -q "http://" /tmp/cl.html
          ! grep -q "https://" /tmp/au.html
          grep -q "<!DOCTYPE html>" /tmp/cl.html
          grep -q "<!DOCTYPE html>" /tmp/au.html
